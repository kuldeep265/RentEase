<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Cashfree Payments...</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0b0b0f;
      color: #cbd5e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .redirect-card {
      text-align: center;
      padding: 2.5rem;
      background: #14141c;
      border: 1px solid rgba(197, 139, 84, 0.25);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      max-width: 440px;
      width: 90%;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(197, 139, 84, 0.2);
      border-top-color: #c58b54;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 0.5rem;
    }
    p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin: 0 0 1.25rem;
      line-height: 1.5;
    }
    .btn-manual {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #c58b54;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body onload="document.getElementById('cfPostForm').submit();">
  <div class="redirect-card">
    <div class="spinner"></div>
    <h2>Connecting to Cashfree...</h2>
    <p>Opening secure sandbox checkout.</p>
    <form id="cfPostForm" method="POST" action="{{ checkout_url }}">
      <input type="hidden" name="payment_session_id" value="{{ payment_session_id }}">
      <input type="hidden" name="paymentSessionId" value="{{ payment_session_id }}">
      <noscript>
        <button type="submit" class="btn-manual">Click to Open Payment</button>
      </noscript>
    </form>
  </div>
  <script>
    document.getElementById('cfPostForm').submit();
  </script>
</body>
</html>
